name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Core deps only: the regression suite and the offline benchmark must
      # pass without the transformer stack, which keeps CI fast and proves the
      # fallback path stays runnable.
      - run: pip install numpy scikit-learn rank-bm25 networkx
      - run: python -m unittest discover -s tests -v
      - run: python -m evaluation.evaluate --ablation
